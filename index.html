<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港畢業旅行 ｜ 行程</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="stripe-bar"></div>
  <header class="site-header">
    <div class="header-inner">
      <span class="hey">HEY · HONG KONG · 畢業旅行</span>
      <h1 class="site-title">香港四天三夜</h1>
      <span class="site-sub">畢業旅行 <span class="dot">●</span> 6/29 – 7/2 <span class="dot">●</span> 13 人團體</span>
    </div>
  </header>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="active">🗺 行程表</a>
      <a href="food.html">🍜 餐食資訊</a>
      <a href="map.html">📍 景點地圖</a>
      <a href="split.html">💰 旅費分帳</a>
    </div>
  </nav>

  <main>
    <!-- 香港天氣預報 -->
    <div class="weather-section">
      <div class="weather-header">
        <span class="weather-title">🌤 香港天氣預報</span>
        <span class="weather-loc">旺角・尖沙咀一帶</span>
      </div>
      <div class="weather-body">
        <div class="weather-cards" id="weatherCards">
          <span class="weather-loading">天氣載入中…</span>
        </div>
      </div>
    </div>

    <h2 class="section-title">行程表 Itinerary <a href="https://www.notion.so/58393f0fdf124d2f9c194d2466a15866" target="_blank" class="sheet-link">🧳 攜帶清單</a></h2>
    <p class="section-desc">點上方標籤切換每日行程。📍 為地圖連結，點餐廳名稱可看詳細資訊。</p>

    <div class="day-tabs" id="dayTabs"></div>
    <div id="dayPanels"></div>
  </main>

  <div class="stripe-bar"></div>
  <footer class="site-footer">
    <span class="hk">HEY HONG KONG</span> ｜ 香港畢業旅行 · 一起把回憶塞滿四天三夜 🇭🇰
  </footer>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/player.js"></script>
  <script>
  /* ── 天氣預報（Open-Meteo，免費無需 API Key）── */
  (function () {
    const WMO = {
      0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
      45:'🌫️', 48:'🌫️',
      51:'🌦️', 53:'🌦️', 55:'🌧️',
      61:'🌧️', 63:'🌧️', 65:'🌧️',
      71:'❄️', 73:'❄️', 75:'❄️', 77:'🌨️',
      80:'🌦️', 81:'🌦️', 82:'⛈️',
      85:'❄️', 86:'❄️', 95:'⛈️', 96:'⛈️', 99:'⛈️'
    };
    const DAYS = ['日','一','二','三','四','五','六'];
    const TRIP = new Set(['2026-06-29','2026-06-30','2026-07-01','2026-07-02']);
    const url  = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=22.3193&longitude=114.1694'
      + '&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
      + '&timezone=Asia%2FHong_Kong&forecast_days=7';

    fetch(url).then(r => r.json()).then(data => {
      const { time, weathercode, temperature_2m_max, temperature_2m_min, precipitation_probability_max } = data.daily;
      const todayStr = new Date().toLocaleDateString('sv', { timeZone: 'Asia/Hong_Kong' });
      const container = document.getElementById('weatherCards');
      container.innerHTML = '';
      time.forEach((dateStr, i) => {
        const d        = new Date(dateStr + 'T12:00:00+08:00');
        const dayLabel = DAYS[d.getDay()];
        const dateLabel = `${d.getMonth() + 1}/${d.getDate()}`;
        const isToday  = dateStr === todayStr;
        const isTrip   = TRIP.has(dateStr);
        const icon     = WMO[weathercode[i]] || '🌡️';
        const hi       = Math.round(temperature_2m_max[i]);
        const lo       = Math.round(temperature_2m_min[i]);
        const rain     = precipitation_probability_max[i];
        const card     = document.createElement('div');
        card.className = 'weather-card' + (isToday ? ' today' : '') + (isTrip ? ' trip-day' : '');
        card.innerHTML = `
          <div class="wc-day">${isToday ? '今天' : '週' + dayLabel}${isTrip ? '✈️' : ''}</div>
          <div class="wc-date">${dateLabel}</div>
          <div class="wc-icon">${icon}</div>
          <div class="wc-temp"><span class="hi">${hi}°</span>/<span class="lo">${lo}°</span></div>
          <div class="wc-rain">💧${rain}%</div>`;
        container.appendChild(card);
      });
    }).catch(() => {
      document.getElementById('weatherCards').innerHTML = '<span class="weather-error">天氣載入失敗，請確認網路連線</span>';
    });
  })();
  </script>
</body>
</html>
