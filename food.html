<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港畢業旅行 ｜ 餐食資訊</title>
  <link rel="stylesheet" href="assets/style.css">
  <script>
    (function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();
  </script>
</head>
<body>
  <div class="stripe-bar"></div>
  <header class="site-header">
    <div class="header-inner">
      <span class="hey">HEY · HONG KONG · 食在香港</span>
      <h1 class="site-title">餐食資訊</h1>
      <span class="site-sub">餐廳一覽 <span class="dot">●</span> 訂位與評論 <span class="dot">●</span> 13 人飲食禁忌速查</span>
    </div>
  </header>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html">🗺 行程表</a>
      <a href="food.html" class="active">🍜 餐食資訊</a>
      <button class="dark-toggle" id="darkToggle" aria-label="切換深色模式">🌙</button>
    </div>
  </nav>

  <main>
    <h2 class="section-title">餐廳一覽 Restaurants</h2>
    <p class="section-desc">整理自「香港行＿餐食相關」表單，免再跳去 Google Sheet 查看。</p>

    <div class="food-controls">
      <span class="lbl">篩選：</span>
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="yes">可容納 13 人 ⭕</button>
      <button class="filter-btn" data-filter="no">無法容納 13 人 ❌</button>
    </div>

    <div class="food-grid" id="foodGrid"></div>

    <h2 class="section-title" style="margin-top:50px">飲食禁忌速查 Survey</h2>
    <p class="section-desc">13 人吃辣狀況與不吃的食物，訂餐廳前先確認一下。</p>

    <div class="survey-wrap">
      <table class="survey">
        <thead>
          <tr><th>姓名</th><th>吃辣</th><th>禁忌 / 不喜歡</th><th>其他備註</th></tr>
        </thead>
        <tbody id="surveyBody"></tbody>
      </table>
    </div>
  </main>

  <div class="stripe-bar"></div>
  <footer class="site-footer">
    <span class="hk">HEY HONG KONG</span> ｜ 香港畢業旅行 · 吃好喝好玩好 🍜🥮🧋
  </footer>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/player.js"></script>
</body>
</html>
