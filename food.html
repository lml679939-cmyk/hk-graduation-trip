<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港畢業旅行 ｜ 餐食資訊</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="stripe-bar"></div>
  <header class="site-header">
    <div class="header-inner">
      <span class="hey">猴賽雷啊</span>
      <h1 class="site-title">餐食資訊</h1>
      <span class="site-sub">餐廳一覽 <span class="dot">●</span> 訂位與評論 <span class="dot">●</span> 13 人飲食禁忌速查</span>
    </div>
  </header>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html">🗺 行程表</a>
      <a href="food.html" class="active">🍜 餐食資訊</a>
      <a href="map.html">📍 景點地圖</a>
      <a href="split.html">💰 旅費分帳</a>
    </div>
  </nav>

  <main>
    <h2 class="section-title">餐廳一覽 Restaurants</h2>

    <div class="food-controls">
      <div class="filter-row">
        <span class="lbl">人數：</span>
        <button class="filter-btn cap-btn active" data-cap="all">全部</button>
        <button class="filter-btn cap-btn" data-cap="yes">可容納 13 人 ⭕</button>
        <button class="filter-btn cap-btn" data-cap="no">無法容納 13 人 ❌</button>
      </div>
      <div class="filter-row">
        <span class="lbl">天數：</span>
        <button class="filter-btn day-btn active" data-day="all">全部</button>
        <button class="filter-btn day-btn" data-day="1">Day 1<small>尖沙咀・旺角</small></button>
        <button class="filter-btn day-btn" data-day="2">Day 2<small>海洋公園・灣仔</small></button>
        <button class="filter-btn day-btn" data-day="3">Day 3<small>旺角・淺水灣・赤柱</small></button>
        <button class="filter-btn day-btn" data-day="4">Day 4<small>堅尼地城・中環</small></button>
      </div>
    </div>

    <div class="food-grid" id="foodGrid"></div>

    <h2 class="section-title" style="margin-top:50px">飲食禁忌速查 Survey</h2>

    <div class="survey-wrap">
      <table class="survey">
        <thead>
          <tr><th>姓名</th><th>吃辣</th><th>禁忌 / 不喜歡</th><th>其他備註</th></tr>
        </thead>
        <tbody id="surveyBody"></tbody>
      </table>
    </div>
  </main>

  <div class="stripe-bar"></div>
  <footer class="site-footer">
    猴賽雷啊
  </footer>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/player.js"></script>
</body>
</html>
